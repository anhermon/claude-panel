schema_version: "1.1"
name: choices-on-ask
description: "Decision only the user can make: the panel ask carries clickable choices, not just a question"
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 120
  prompt: "Start the multi-step work of setting up storage for our new analytics service. There are no files in this session, so work from this description. The candidates are Postgres, ClickHouse and BigQuery. I have not decided and you cannot proceed without my pick, so get it from me."
