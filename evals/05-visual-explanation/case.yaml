schema_version: "1.1"
name: visual-explanation
description: "Teach/explain request from a visual learner: a scene (any layout) with an alt, not prose or bullet cards; a deck is not required"
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 300
  prompt: "Walk me through how a hash map handles collisions. I learn best visually. There are no files in this session; build whatever you need from scratch. (File-writing tools are disabled in this test session, so a folder you would write does not exist; publish the scene the way you normally would anyway.)"
