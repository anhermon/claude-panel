schema_version: "1.1"
name: proactive-debug-without-panel-cue
description: "A debugging task starts task + why without a panel request and posts a board frame that shows the suspects or evidence (steps, hypotheses, timeline, compare...). Note: the no-plugin arm has no panel tool, so its delta only shows the tool is used when present."
runs: 2
execution:
  max_turns: 12
  timeout_seconds: 360
  prompt: "Debug an intermittent cache expiry failure: sometimes a value expires immediately and sometimes it never expires. Suspects are mixed seconds and milliseconds, a stale mocked clock, and a boundary comparison. Write one small reproduction script (under 40 lines) in a scratch folder, run it once per suspect, and report which evidence rules each suspect in or out."
